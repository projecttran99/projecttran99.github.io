backend:
  name: github
  repo: projecttran99/projecttran99.github.io
  branch: master

media_folder: "static"
public_folder: "/static"

collections:
  - name: "posts"
    label: "Artikel Blog"
    label_singular: "Artikel"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: "photos"
    public_folder: "/photos"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Judul Artikel (Title)", name: "title", widget: "string", required: true }
      - { label: "Judul Tampilan (Text Title)", name: "text-title", widget: "string", required: true }
      - { label: "Penulis (Writer)", name: "writer", widget: "string", default: "H. Denny Rakhmad Widi Ashari, S.AP., M.E." }
      - label: "Meta Deskripsi SEO (Maksimal 160 Karakter)"
        name: "description"
        widget: "string"
        required: true
        pattern: ['^.{1,160}$', "Maksimal 160 karakter! Harap persingkat deskripsi Anda agar ramah Google SERP."]
        hint: "Maksimal 160 karakter untuk optimasi snippet Google SERP (panjang ideal 120-160 karakter)."
      - label: "Foto 1: Bagian Atas (Sesudah Nama Penulis)"
        name: "photos"
        widget: "image"
        required: true
        hint: "Foto utama yang tampil di atas setelah nama penulis (Rasio disarankan 16:9)"
      - label: "Alt Text Foto 1 (Atas)"
        name: "amp-img-alt"
        widget: "string"
        required: true
        hint: "Deskripsi gambar foto atas untuk SEO"
      - label: "Foto 2: Bagian Tengah (Tengah Artikel)"
        name: "photo_middle"
        widget: "image"
        required: false
        hint: "Foto yang otomatis disisipkan di bagian tengah artikel (Rasio disarankan 16:9)"
      - label: "Alt Text Foto 2 (Tengah)"
        name: "photo_middle_alt"
        widget: "string"
        required: false
      - label: "Foto 3: Bagian Bawah (Bawah Artikel)"
        name: "photo_bottom"
        widget: "image"
        required: false
        hint: "Foto penutup di bagian akhir artikel sebelum rekomendasi (Rasio disarankan 16:9)"
      - label: "Alt Text Foto 3 (Bawah)"
        name: "photo_bottom_alt"
        widget: "string"
        required: false
      - { label: "AMP Image Source (Legacy)", name: "amp-img-scr", widget: "hidden", default: "" }
      - { label: "AMP Image Width", name: "amp-img-width", widget: "hidden", default: 800 }
      - { label: "AMP Image Height", name: "amp-img-height", widget: "hidden", default: 450 }
      - { label: "AMP Image Layout", name: "amp-img-layout", widget: "hidden", default: "responsive" }
      - { label: "Konten Artikel", name: "body", widget: "markdown", required: true }

  - name: "products"
    label: "Armada Mobil (Tarif Sewa)"
    label_singular: "Armada"
    folder: "_data-products"
    create: true
    slug: "{{slug}}"
    summary: "{{text-title}} - {{price}}"
    media_folder: "static"
    public_folder: "/static"
    fields:
      - { label: "Nama Mobil", name: "text-title", widget: "string", required: true, hint: "Contoh: Avanza, Innova Reborn, Hiace" }
      - { label: "Judul Halaman (SEO)", name: "title", widget: "string", required: false, hint: "Contoh: Sewa Mobil Avanza Surabaya Murah" }
      - { label: "Ringkasan / Meta Deskripsi", name: "description", widget: "text", required: false, hint: "Teks ringkasan di bawah judul utama dan untuk SEO Google (maks 160 karakter)" }
      - { label: "Badge / Label Atas", name: "badge", widget: "string", required: false, default: "Armada Resmi Tran99", hint: "Label badge pill di atas judul (default: Armada Resmi Tran99)" }
      - { label: "Judul Utama Halaman (Hero)", name: "hero_title", widget: "string", required: false, hint: "Judul besar h1 di halaman detail. Biarkan kosong jika ingin otomatis: Sewa Mobil [Nama Mobil] Surabaya" }

      # --- TARIF SEWA & SIDEBAR ---
      - { label: "Tarif Sewa (Price)", name: "price", widget: "string", required: true, hint: "Contoh: Rp. 400.000 atau Call" }
      - { label: "Satuan Tarif", name: "price_unit", widget: "string", required: false, default: "/ hari", hint: "Satuan waktu sewa (default: / hari)" }
      - { label: "Badge Kartu Tarif", name: "price_badge", widget: "string", required: false, default: "Tarif Sewa Terbaik" }
      - { label: "Label Harga", name: "price_label", widget: "string", required: false, default: "Harga Sewa Mulai:" }
      - { label: "Catatan Tarif Sewa", name: "price_note", widget: "string", required: false, default: "*Sudah termasuk jasa supir profesional" }

      # --- FASILITAS (SIDEBAR CHECKLIST) ---
      - { label: "Judul Bagian Fasilitas", name: "facilities_title", widget: "string", required: false, default: "Fasilitas Yang Didapat:" }
      - { label: "Fasilitas 1", name: "list-1", widget: "string", default: "Termasuk Driver." }
      - { label: "Fasilitas 2", name: "list-2", widget: "string", default: "Pemakaian Area Surabaya." }
      - { label: "Fasilitas 3", name: "list-3", widget: "string", default: "Pemakaian Luar Kota [Call]." }
      - { label: "Fasilitas 4", name: "list-4", widget: "string", required: false, default: "Kondisi Kabin Bersih & Segar" }
      - { label: "Fasilitas 5", name: "list-5", widget: "string", required: false, default: "Customer Service 24 Jam" }

      # --- TOMBOL & NAVIGASI SIDEBAR ---
      - { label: "Teks Tombol WhatsApp", name: "cta_wa_text", widget: "string", required: false, default: "Pesan Sekarang via WhatsApp" }
      - { label: "Teks Tombol Telepon", name: "cta_tel_text", widget: "string", required: false, hint: "Biarkan kosong untuk otomatis: Telepon: 081-330-548-581" }
      - { label: "Teks Link Kembali ke Armada", name: "back_link_text", widget: "string", required: false, default: "← Lihat Semua Armada Mobil" }

      # --- FOTO MOBIL ---
      - { label: "Foto Mobil", name: "amp-img-scr", widget: "image", required: true, media_folder: "static", public_folder: "/static" }
      - { label: "Alt Text Foto", name: "amp-img-alt", widget: "string", required: true }
      - { label: "Thumbnail CMS", name: "image", widget: "hidden" }
      - { label: "Foto Open Graph", name: "photos", widget: "hidden" }
      - { label: "Lebar Foto", name: "amp-img-width", widget: "number", default: 250, value_type: "int" }
      - { label: "Tinggi Foto", name: "amp-img-height", widget: "number", default: 250, value_type: "int" }
      - { label: "Layout Gambar", name: "amp-img-layout", widget: "hidden", default: "responsive" }

      # --- 4 FITUR KEUNGGULAN (HIGHLIGHTS) ---
      - { label: "Keunggulan 1 - Icon Emoji", name: "feat1_icon", widget: "string", required: false, default: "🚗" }
      - { label: "Keunggulan 1 - Judul", name: "feat1_title", widget: "string", required: false, default: "Armada Prima" }
      - { label: "Keunggulan 1 - Keterangan", name: "feat1_desc", widget: "string", required: false, default: "Unit bersih, wangi & selalu diservis berkala" }

      - { label: "Keunggulan 2 - Icon Emoji", name: "feat2_icon", widget: "string", required: false, default: "👔" }
      - { label: "Keunggulan 2 - Judul", name: "feat2_title", widget: "string", required: false, default: "Supir Berpengalaman" }
      - { label: "Keunggulan 2 - Keterangan", name: "feat2_desc", widget: "string", required: false, default: "Ramah, sopan, dan menguasai rute Jawa Timur" }

      - { label: "Keunggulan 3 - Icon Emoji", name: "feat3_icon", widget: "string", required: false, default: "❄️" }
      - { label: "Keunggulan 3 - Judul", name: "feat3_title", widget: "string", required: false, default: "Full AC Dingin" }
      - { label: "Keunggulan 3 - Keterangan", name: "feat3_desc", widget: "string", required: false, default: "Kabin sejuk nyaman untuk seluruh keluarga" }

      - { label: "Keunggulan 4 - Icon Emoji", name: "feat4_icon", widget: "string", required: false, default: "⏱️" }
      - { label: "Keunggulan 4 - Judul", name: "feat4_title", widget: "string", required: false, default: "On-Time Standby" }
      - { label: "Keunggulan 4 - Keterangan", name: "feat4_desc", widget: "string", required: false, default: "Jemput tepat waktu di Bandara Juanda / Hotel" }

      # --- DESKRIPSI LAYANAN LENGKAP ---
      - { label: "Judul Deskripsi Layanan", name: "article_title", widget: "string", required: false, hint: "Biarkan kosong untuk otomatis: Kenyamanan Sewa [Nama Mobil] di Tran99 Surabaya" }
      - { label: "Paragraf Deskripsi 1", name: "article_p1", widget: "text", required: false, hint: "Penjelasan kebersihan, kenyamanan kabin, dan perawatan armada" }
      - { label: "Paragraf Deskripsi 2", name: "article_p2", widget: "text", required: false, hint: "Penjelasan peruntukan (bisnis, wisata Malang/Bromo, antar-jemput bandara)" }

      # --- DAFTAR LAYANAN TERMASUK ---
      - { label: "Judul Layanan Termasuk", name: "included_title", widget: "string", required: false, default: "Layanan Termasuk:" }
      - { label: "Poin Layanan 1", name: "included_1", widget: "string", required: false, hint: "Contoh: Unit Kendaraan: Mobil [Nama] kondisi prima wangi" }
      - { label: "Poin Layanan 2", name: "included_2", widget: "string", required: false, hint: "Contoh: Jasa Driver Profesional..." }
      - { label: "Poin Layanan 3", name: "included_3", widget: "string", required: false, hint: "Contoh: Wilayah Operasional: Seluruh Surabaya..." }
      - { label: "Poin Layanan 4", name: "included_4", widget: "string", required: false, hint: "Contoh: Kemudahan Pemesanan: Booking cepat..." }

      # --- CARA PEMESANAN CEPAT ---
      - { label: "Judul Cara Pemesanan", name: "order_steps_title", widget: "string", required: false, default: "Cara Pemesanan Cepat:" }
      - { label: "Langkah Pemesanan 1", name: "order_step_1", widget: "string", required: false, hint: 'Contoh: Klik tombol "Pesan Sekarang via WhatsApp" di halaman ini.' }
      - { label: "Langkah Pemesanan 2", name: "order_step_2", widget: "string", required: false, hint: "Contoh: Kirimkan informasi tanggal sewa, durasi pemakaian, dan lokasi penjemputan Anda." }
      - { label: "Langkah Pemesanan 3", name: "order_step_3", widget: "string", required: false, hint: "Contoh: Admin Tran99 akan mengonfirmasi ketersediaan armada dan jadwal perjalanan Anda." }

      # --- REKOMENDASI ARMADA LAINNYA ---
      - { label: "Judul Pilihan Armada Lainnya", name: "other_fleet_title", widget: "string", required: false, default: "Pilihan Armada Lainnya" }
      - { label: "Deskripsi Pilihan Armada Lainnya", name: "other_fleet_desc", widget: "string", required: false, default: "Temukan kendaraan terbaik lainnya yang sesuai dengan kebutuhan perjalanan Anda" }

      # --- KONTEN BEBAS / MARKDOWN BODY (OPSIONAL) ---
      - { label: "Konten Bebas Tambahan (Opsional)", name: "body", widget: "markdown", required: false, hint: "Jika diisi, konten markdown ini akan ditambahkan di bawah deskripsi layanan" }

  - name: "gallery"
    label: "Galeri Instagram"
    label_singular: "Foto Instagram"
    folder: "_data-gallery"
    create: true
    slug: "{{slug}}"
    summary: "{{data-shortcode}}"
    fields:
      - { label: "Instagram Post Shortcode", name: "data-shortcode", widget: "string", required: true, hint: "Kode unik postingan Instagram dari URL (contoh: dari https://www.instagram.com/p/B8VJKGRleaJ/ kodenya adalah B8VJKGRleaJ)" }

  - name: "tiktok"
    label: "Video TikTok"
    label_singular: "Video TikTok"
    folder: "_data-tiktok"
    create: true
    slug: "{{slug}}"
    summary: "{{data-src}}"
    fields:
      - { label: "URL Video TikTok", name: "data-src", widget: "string", required: true, hint: "URL video TikTok (contoh: https://www.tiktok.com/@www.tran99.com/video/7295685281359990021)" }

  - name: "pages"
    label: "Kelola Halaman"
    files:
      - label: "Halaman Utama (Beranda / Homepage)"
        name: "home_page"
        file: "index.html"
        fields:
          - { label: "Judul Browser (SEO Title)", name: "title", widget: "string", required: true }
          - { label: "Meta Deskripsi (SEO)", name: "description", widget: "text", required: true }
          - { label: "Foto Header / Open Graph", name: "photos", widget: "image" }

          # --- HERO SECTION ---
          - { label: "Hero - Badge Atas", name: "hero_badge", widget: "string", default: "Rental Mobil Surabaya Terpercaya #1" }
          - { label: "Hero - Judul Utama (H1)", name: "hero_title", widget: "string", default: "Rental Mobil Surabaya & Sewa Mobil Murah Terpercaya" }
          - { label: "Hero - Subjudul (Deskripsi)", name: "hero_subtitle", widget: "text", default: "Pusat sewa mobil Surabaya terlengkap sudah termasuk supir berpengalaman, armada bersih wangi ber-AC dingin, dan layanan siap siaga 24 jam untuk kebutuhan perjalanan dinas, bisnis, maupun wisata Anda." }

          # --- TENTANG KAMI (ABOUT) ---
          - { label: "Tentang Kami - Badge", name: "about_badge", widget: "string", default: "Tentang Tran99" }
          - { label: "Tentang Kami - Judul (H2)", name: "about_title", widget: "string", default: "Penyedia Jasa Rental Mobil Surabaya Berstandar Prima" }
          - { label: "Tentang Kami - Paragraf 1", name: "about_p1", widget: "text", default: "Tran99.com adalah perusahaan penyedia jasa transportasi darat terpercaya di Surabaya yang melayani sewa mobil harian, mingguan, hingga bulanan untuk wilayah Surabaya, Bandara Juanda, dan seluruh Jawa Timur." }
          - { label: "Tentang Kami - Paragraf 2", name: "about_p2", widget: "text", default: "Dengan komitmen menghadirkan kenyamanan dan keamanan perjalanan maksimal, setiap unit armada kami selalu menjalani perawatan rutin berkala, terjaga kebersihannya, memiliki kabin wangi, dan full AC dingin. Didukung supir profesional yang ramah, sopan, dan menguasai rute jalan, kami siap menemani agenda dinas, bisnis, maupun wisata Anda." }
          - { label: "Tentang Kami - Foto Gambar", name: "about_img", widget: "image", default: "/static/rental-mobil-surabaya.jpg", media_folder: "static", public_folder: "/static" }
          - { label: "Tentang Kami - Alt Text Foto", name: "about_img_alt", widget: "string", default: "Rental Mobil Surabaya Tran99" }

          # --- ARMADA PRODUK ---
          - { label: "Armada Mobil - Badge", name: "products_badge", widget: "string", default: "Pilihan Armada Terbaik" }
          - { label: "Armada Mobil - Judul (H2)", name: "products_title", widget: "string", default: "Daftar Armada & Harga Sewa Mobil Terpopuler" }
          - { label: "Armada Mobil - Subjudul", name: "products_subtitle", widget: "text", default: "Pilihan unit kendaraan terawat lengkap dengan supir ramah berpengalaman siap melayani perjalanan Anda di Surabaya dan Jawa Timur." }

          # --- BLOG & ARTIKEL ---
          - { label: "Blog - Badge", name: "blog_badge", widget: "string", default: "Informasi & Edukasi" }
          - { label: "Blog - Judul (H2)", name: "blog_title", widget: "string", default: "Artikel & Info Wisata Terbaru" }
          - { label: "Blog - Subjudul", name: "blog_subtitle", widget: "text", default: "Dapatkan tips perjalanan, rekomendasi destinasi wisata di Jawa Timur, dan informasi seputar sewa mobil Surabaya bersama Tran99." }

      - label: "Halaman Kontak (/contact/)"
        name: "contact_page"
        file: "contact.html"
        fields:
          - { label: "Judul Halaman (Browser Title / SEO)", name: "title", widget: "string", required: true }
          - { label: "Meta Deskripsi SEO", name: "description", widget: "text", required: true }
          - { label: "Foto Header / Open Graph", name: "photos", widget: "image" }
          - { label: "Judul Tampilan Kontak", name: "header_title", widget: "string", default: "Hubungi Kami" }
          - { label: "Subjudul Tampilan Kontak", name: "header_subtitle", widget: "text", default: "Layanan Reservasi & Konsultasi Rental Mobil Surabaya 24 Jam Nonstop. Hubungi kami melalui WhatsApp, Telepon, Email, atau kunjungi kantor operasional kami." }
          - { label: "Label Alamat", name: "address_label", widget: "string", default: "Alamat Kantor & Pool Armada" }
          - { label: "Label WhatsApp Utama", name: "whatsapp_primary_label", widget: "string", default: "WhatsApp Utama (Fast Response 24 Jam)" }
          - { label: "Label WhatsApp Cadangan", name: "whatsapp_secondary_label", widget: "string", default: "WhatsApp Admin 2 (Cadangan)" }
          - { label: "Label Telepon", name: "phone_label", widget: "string", default: "Telepon Langsung" }
          - { label: "Label Email", name: "email_label", widget: "string", default: "Email Resmi" }

  - name: "settings"
    label: "Informasi Perusahaan & Kontak"
    files:
      - label: "Profil Perusahaan & Kontak Operasional"
        name: "general"
        file: "_config.yml"
        fields:
          - { label: "Nama Singkat Brand (Navigasi & Hak Cipta)", name: "brand_name", widget: "string", default: "Tran99", required: true }
          - { label: "Nama Perusahaan", name: "company", widget: "string", required: true }
          - { label: "Alamat Jalan", name: "streetAddress", widget: "string", required: true }
          - { label: "Kota", name: "city", widget: "string", default: "Sidoarjo" }
          - { label: "Provinsi", name: "province", widget: "string", default: "Jawa Timur" }
          - { label: "Negara", name: "country", widget: "string", default: "Indonesia" }
          - { label: "Kode Pos", name: "postalCode", widget: "string", default: "61256" }
          - { label: "Alamat Lengkap / Wilayah", name: "address", widget: "string" }
          - { label: "Link Google Maps", name: "google_maps_url", widget: "string", required: true }
          - { label: "Google Maps Embed URL (iframe)", name: "google_maps_embed", widget: "string", required: true }
          - { label: "Alamat Email", name: "email", widget: "string", required: true }
          - { label: "Telepon Utama (Tampilan)", name: "telephonedetail", widget: "string", required: true }
          - { label: "Telepon Format Internasional (tel:)", name: "telephone", widget: "string", required: true }
          - { label: "WhatsApp Utama (Tampilan)", name: "whatsapp_primary", widget: "string", required: true }
          - { label: "WhatsApp Utama (Nomor Link)", name: "whatsapp_primary_phone", widget: "string", required: true }
          - { label: "WhatsApp Ke-2 (Tampilan)", name: "whatsapp_secondary", widget: "string", required: true }
          - { label: "WhatsApp Ke-2 (Nomor Link)", name: "whatsapp_secondary_phone", widget: "string", required: true }
          - { label: "Link Facebook", name: "social_facebook", widget: "string", required: false }
          - { label: "Link Instagram", name: "social_instagram", widget: "string", required: false }
          - { label: "Link TikTok", name: "social_tiktok", widget: "string", required: false }
          - { label: "Link Twitter / X", name: "social_twitter", widget: "string", required: false }
          - { label: "Link YouTube", name: "social_youtube", widget: "string", required: false }
          - { label: "Deskripsi Singkat Website", name: "description", widget: "text" }


