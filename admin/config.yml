backend:
  name: github
  repo: projecttran99/projecttran99.github.io
  branch: master

media_folder: "photos"
public_folder: "/photos"

collections:
  - name: "posts"
    label: "Artikel Blog"
    label_singular: "Artikel"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Judul Artikel (Title)", name: "title", widget: "string", required: true }
      - { label: "Judul Tampilan (Text Title)", name: "text-title", widget: "string", required: true }
      - { label: "Penulis (Writer)", name: "writer", widget: "string", default: "H. Denny Rakhmad Widi Ashari, S.AP., M.E." }
      - { label: "Meta Deskripsi SEO", name: "description", widget: "text", required: true }
      - { label: "Foto Utama (Photos URL)", name: "photos", widget: "image", required: true }
      - { label: "AMP Image Source", name: "amp-img-scr", widget: "image", required: true }
      - { label: "AMP Image Alt Text", name: "amp-img-alt", widget: "string", required: true }
      - { label: "AMP Image Width", name: "amp-img-width", widget: "number", default: 550, value_type: "int" }
      - { label: "AMP Image Height", name: "amp-img-height", widget: "number", default: 309, value_type: "int" }
      - { label: "AMP Image Layout", name: "amp-img-layout", widget: "hidden", default: "responsive" }
      - { label: "Konten Artikel", name: "body", widget: "markdown", required: true }

  - name: "products"
    label: "Armada Mobil (Tarif Sewa)"
    label_singular: "Armada"
    folder: "_data-products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nama Mobil", name: "text-title", widget: "string", required: true }
      - { label: "Foto Mobil", name: "amp-img-scr", widget: "image", required: true }
      - { label: "Alt Text Foto", name: "amp-img-alt", widget: "string", required: true }
      - { label: "Lebar Foto", name: "amp-img-width", widget: "number", default: 165, value_type: "int" }
      - { label: "Tinggi Foto", name: "amp-img-height", widget: "number", default: 165, value_type: "int" }
      - { label: "Layout Gambar", name: "amp-img-layout", widget: "hidden", default: "fixed" }
      - { label: "Fasilitas 1", name: "list-1", widget: "string", default: "Termasuk Driver." }
      - { label: "Fasilitas 2", name: "list-2", widget: "string", default: "Pemakaian Area Surabaya." }
      - { label: "Fasilitas 3", name: "list-3", widget: "string", default: "Pemakaian Luar Kota [Call]." }
      - { label: "Tarif Sewa (Price)", name: "price", widget: "string", required: true }

  - name: "pages"
    label: "Kelola Halaman"
    files:
      - label: "Halaman Kontak (/contact/)"
        name: "contact_page"
        file: "contact.html"
        fields:
          - { label: "Judul Halaman (Browser Title / SEO)", name: "title", widget: "string", required: true }
          - { label: "Meta Deskripsi SEO", name: "description", widget: "text", required: true }
          - { label: "Foto Header / Open Graph", name: "photos", widget: "image" }
          - { label: "Judul Tampilan Kontak", name: "header_title", widget: "string", default: "Hubungi Kami" }
          - { label: "Subjudul Tampilan Kontak", name: "header_subtitle", widget: "text", default: "Layanan Reservasi & Konsultasi Rental Mobil Surabaya 24 Jam Nonstop. Hubungi kami melalui WhatsApp, Telepon, Email, atau kunjungi kantor operasional kami." }
          - { label: "Label Alamat", name: "address_label", widget: "string", default: "Alamat Kantor & Pool Armada" }
          - { label: "Label WhatsApp Utama", name: "whatsapp_primary_label", widget: "string", default: "WhatsApp Utama (Fast Response 24 Jam)" }
          - { label: "Label WhatsApp Cadangan", name: "whatsapp_secondary_label", widget: "string", default: "WhatsApp Admin 2 (Cadangan)" }
          - { label: "Label Telepon", name: "phone_label", widget: "string", default: "Telepon Langsung" }
          - { label: "Label Email", name: "email_label", widget: "string", default: "Email Resmi" }

  - name: "settings"
    label: "Informasi Perusahaan & Kontak"
    files:
      - label: "Profil Perusahaan & Kontak Operasional"
        name: "general"
        file: "_config.yml"
        fields:
          - { label: "Nama Singkat Brand (Navigasi & Hak Cipta)", name: "brand_name", widget: "string", default: "Tran99", required: true }
          - { label: "Nama Perusahaan", name: "company", widget: "string", required: true }
          - { label: "Alamat Jalan", name: "streetAddress", widget: "string", required: true }
          - { label: "Kota", name: "city", widget: "string", default: "Sidoarjo" }
          - { label: "Provinsi", name: "province", widget: "string", default: "Jawa Timur" }
          - { label: "Negara", name: "country", widget: "string", default: "Indonesia" }
          - { label: "Kode Pos", name: "postalCode", widget: "string", default: "61256" }
          - { label: "Alamat Lengkap / Wilayah", name: "address", widget: "string" }
          - { label: "Link Google Maps", name: "google_maps_url", widget: "string", required: true }
          - { label: "Google Maps Embed URL (iframe)", name: "google_maps_embed", widget: "string", required: true }
          - { label: "Alamat Email", name: "email", widget: "string", required: true }
          - { label: "Telepon Utama (Tampilan)", name: "telephonedetail", widget: "string", required: true }
          - { label: "Telepon Format Internasional (tel:)", name: "telephone", widget: "string", required: true }
          - { label: "WhatsApp Utama (Tampilan)", name: "whatsapp_primary", widget: "string", required: true }
          - { label: "WhatsApp Utama (Nomor Link)", name: "whatsapp_primary_phone", widget: "string", required: true }
          - { label: "WhatsApp Ke-2 (Tampilan)", name: "whatsapp_secondary", widget: "string", required: true }
          - { label: "WhatsApp Ke-2 (Nomor Link)", name: "whatsapp_secondary_phone", widget: "string", required: true }
          - { label: "Link Facebook", name: "social_facebook", widget: "string", required: false }
          - { label: "Link Instagram", name: "social_instagram", widget: "string", required: false }
          - { label: "Link TikTok", name: "social_tiktok", widget: "string", required: false }
          - { label: "Link Twitter / X", name: "social_twitter", widget: "string", required: false }
          - { label: "Link YouTube", name: "social_youtube", widget: "string", required: false }
          - { label: "Deskripsi Singkat Website", name: "description", widget: "text" }


