<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: "Halaman Tidak Ditemukan - 404" }} | Tran99.com</title>
    <meta name="robots" content="noindex, follow">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .error-container {
            max-width: 520px;
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .error-badge {
            font-size: 5rem;
            font-weight: 800;
            color: #1976d2;
            line-height: 1;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }
        p {
            font-size: 1rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        @media (min-width: 480px) {
            .error-actions {
                flex-direction: row;
                justify-content: center;
            }
        }
        .btn-action {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            transition: opacity 0.2s ease;
        }
        .btn-action:hover {
            opacity: 0.9;
        }
        .btn-primary {
            background: #1976d2;
            color: #ffffff;
        }
        .btn-whatsapp {
            background: #25d366;
            color: #ffffff;
        }
        .error-contact {
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 1.25rem;
        }
        .error-contact p {
            margin-bottom: 0.25rem;
            font-size: 0.85rem;
            color: #64748b;
        }
        .phone-link {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1976d2;
            text-decoration: none;
        }
    </style>
</head>
<body>
    {{ content }}
</body>
</html>
